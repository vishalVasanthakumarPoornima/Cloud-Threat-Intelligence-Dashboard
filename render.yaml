services:
  - type: web
    name: cloud-threat-intelligence-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api
      - key: ALLOW_PRIVATE_IOCS
        value: false
      - key: MAX_REQUEST_BYTES
        value: 8192
      - key: MAX_UPLOAD_FILE_BYTES
        value: 33554432
      - key: ANALYZE_RATE_LIMIT_PER_MINUTE
        value: 30
      - key: CONNECTOR_TIMEOUT_SECONDS
        value: 12
      - key: AI_PROVIDER
        value: disabled
      - key: ALLOWED_ORIGINS
        value: https://cloud-threat-intelligence-dashboard.onrender.com

  - type: web
    name: cloud-threat-intelligence-dashboard
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cloud-threat-intelligence-api.onrender.com/api
